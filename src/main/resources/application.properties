spring.application.name=marketplace-backend
server.port=8080
spring.jpa.hibernate.ddl-auto=validate
marketplace.cors.allowed-origin=${MARKETPLACE_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Demo credentials are configured per environment. Use MARKETPLACE_DEMO_* variables
# for demo deployments; values are intentionally never logged.
marketplace.demo.admin-email=${MARKETPLACE_DEMO_ADMIN_EMAIL:}
marketplace.demo.admin-password=${MARKETPLACE_DEMO_ADMIN_PASSWORD:}
marketplace.demo.vendor-email=${MARKETPLACE_DEMO_VENDOR_EMAIL:}
marketplace.demo.vendor-password=${MARKETPLACE_DEMO_VENDOR_PASSWORD:}
marketplace.demo.customer-email=${MARKETPLACE_DEMO_CUSTOMER_EMAIL:}
marketplace.demo.customer-password=${MARKETPLACE_DEMO_CUSTOMER_PASSWORD:}
marketplace.demo.activate-existing-users=${MARKETPLACE_DEMO_ACTIVATE_EXISTING_USERS:false}
